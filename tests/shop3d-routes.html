<!doctype html><html lang="ko"><meta charset="utf-8"><title>MY FIT 직접 경로 검증</title><style>body{font:14px sans-serif}button{padding:12px;margin:4px}iframe{width:100%;height:70vh;border:1px solid #aaa}pre{white-space:pre-wrap}</style><h1>로컬 직접 경로·자산 검사</h1><div id="routes"><button data-route="closet">내 옷장 직접 진입</button><button data-route="stylist">AI 코디 직접 진입</button><button data-route="diary">착장 기록 직접 진입</button><button data-route="shop">3D 매장 진입</button></div><button id="inspect">표시 상태와 로딩 자산 검사</button><pre id="result"></pre><iframe title="실제 MY FIT 앱" id="app"></iframe><script>
if(!['127.0.0.1','localhost'].includes(location.hostname))throw Error('Local tests only');
const frame=document.querySelector('#app');document.querySelector('#routes').onclick=e=>{const r=e.target.dataset.route;if(r)frame.src='../index.html?route-check='+Date.now()+'#'+r;};
document.querySelector('#inspect').onclick=()=>{const w=frame.contentWindow,d=w.document;document.querySelector('#result').textContent=JSON.stringify({route:w.location.hash,visibleViews:[...d.querySelectorAll('section[data-view]')].filter(e=>!e.hidden).map(e=>e.dataset.view),canvases:d.querySelectorAll('#shop-canvas').length,shopState:d.querySelector('#shop-page')?.dataset.state,resources:w.performance.getEntriesByType('resource').filter(e=>e.name.includes('/shop3d/')).map(e=>e.name.split('/').pop())},null,2);};
</script></html>
