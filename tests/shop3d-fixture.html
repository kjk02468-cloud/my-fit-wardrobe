<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>MY FIT — 격리된 3D 복구 검증</title><link rel="stylesheet" href="shop3d/shop.css"><style>body{margin:0}#qa{position:fixed;z-index:100;bottom:0;left:0;right:0;background:#fff;color:#111;font:12px sans-serif;padding:7px}#qa button,#qa a{margin:3px;padding:7px}#qa-output{max-height:80px;overflow:auto;white-space:pre-wrap}#shop-page{bottom:120px}.site-header,footer{display:none}</style></head><body><header class="site-header"></header><section id="shop-page"></section><footer></footer><div id="qa"><strong>격리된 테스트 · 실제 DB 접근 없음 · 저장은 메모리에만 유지</strong><br><a href="tests/shop3d-fixture.html#shop">일반 검증</a><a href="tests/shop3d-fixture.html?nogl#shop">WebGL 미지원</a><a href="tests/shop3d-fixture.html?reduce#shop">모션 감소</a><button id="qa-loss">컨텍스트 손실</button><button id="qa-restore">컨텍스트 복원</button><button id="qa-quota">저장 오류 전환</button><button id="qa-edit">선택 품목 변경</button><button id="qa-delete">선택 품목 삭제</button><button id="qa-404">사진 404</button><button id="qa-metrics">상태·자산 측정</button><pre id="qa-output"></pre></div>
<script type="module">
if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('This test fixture only runs locally.');
const out=document.querySelector('#qa-output'),params=new URLSearchParams(location.search),memory=new Map();let quota=false,extension,activeItems;
Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)||null,setItem(k,v){if(quota)throw Error('TEST QuotaExceededError');memory.set(k,v);}}});
if(params.has('nogl')){const real=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,...rest){return /webgl/.test(type)?null:real.call(this,type,...rest);};}
if(params.has('reduce')){const real=window.matchMedia.bind(window);window.matchMedia=q=>q.includes('prefers-reduced-motion')?{matches:true}:real(q);}
const manifest=await(await fetch('published-closet.json')).json();activeItems=(await Promise.all(manifest.dataFiles.map(async f=>(await(await fetch(f.path)).json()).items))).flat();
window.MyFitBridge={getItems:()=>activeItems,openItem:id=>out.textContent='상세 요청 '+id,navigate:route=>{location.hash=route;window.dispatchEvent(new CustomEvent('myfit-route',{detail:route}));},getWeather:()=>null,refreshWeather:async()=>{},getCollections:()=>[],recommend:()=>[],openLog:ids=>out.textContent='명시적 실제 기록 초안 '+ids.join(',')};
await import('./shop3d/entry.mjs');window.dispatchEvent(new Event('myfit-ready'));
document.querySelector('#qa-loss').onclick=()=>{extension=document.querySelector('canvas')?.getContext('webgl2')?.getExtension('WEBGL_lose_context');extension?.loseContext();out.textContent=extension?'실제 WebGL context loss 요청':'확장 미지원';};
document.querySelector('#qa-restore').onclick=()=>extension?.restoreContext();
document.querySelector('#qa-quota').onclick=()=>{quota=!quota;out.textContent='저장 오류 '+quota+' · 기존 메모리 저장 건수 '+memory.size;};
const selected=()=>document.querySelector('[data-wear]')?.dataset.wear||activeItems.find(i=>i.cat==='top').id;
document.querySelector('#qa-edit').onclick=()=>{const id=selected();activeItems=activeItems.map(i=>i.id===id?{...i,color:i.color==='pink'?'black':'pink'}:i);window.dispatchEvent(new Event('myfit-items-changed'));out.textContent='격리 복사본 변경 '+id;};
document.querySelector('#qa-delete').onclick=()=>{const id=selected();activeItems=activeItems.filter(i=>i.id!==id);window.dispatchEvent(new Event('myfit-items-changed'));out.textContent='격리 복사본 삭제 '+id;};
document.querySelector('#qa-404').onclick=()=>{activeItems=activeItems.map((i,n)=>n<8?{...i,image:'./tests/nonexistent-product.jpg'}:i);window.dispatchEvent(new Event('myfit-items-changed'));out.textContent='전시 이미지 8개를 테스트 404로 변경';};
document.querySelector('#qa-metrics').onclick=()=>{out.textContent=JSON.stringify({state:document.querySelector('#shop-page').dataset.state,canvases:document.querySelectorAll('#shop-canvas').length,position:document.querySelector('#shop-position')?.textContent,fps:document.querySelector('#shop-performance')?.textContent,resources:performance.getEntriesByType('resource').filter(e=>e.name.includes('/shop3d/')).map(e=>({name:e.name.split('/').pop(),encoded:e.encodedBodySize,duration:Math.round(e.duration)})),storage:[...memory.keys()]},null,2);};
</script></body></html>
